<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Typing Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <header class="app-header">
      <div>
        <h1>Typing Practice</h1>
        <p class="subtitle">Improve your typing speed and accuracy</p>
      </div>

      <div class="overall-stats">
        <h3>Overall Average</h3>
        <div class="overall-stat-row">
          <span>WPM</span>
          <strong id="overallWpm">0</strong>
        </div>
        <div class="overall-stat-row">
          <span>Accuracy</span>
          <strong id="overallAccuracy">0%</strong>
        </div>
        <div class="overall-stat-row">
          <span>Time</span>
          <strong id="overallTime">0 sec</strong>
        </div>
      </div>
    </header>

    <main>

      <section class="lesson-selector-section">
        <label for="lessonSelect">Choose a lesson:</label>
        <select id="lessonSelect"></select>
      </section>

      <section class="lesson-card">

        <div class="lesson-heading">
          <div>
            <h2 id="lessonTitle">Lesson 1</h2>
            <p id="lessonDescription"></p>
          </div>

          <div class="lesson-number" id="lessonNumber">1</div>
        </div>

        <div class="text-display" id="textDisplay"></div>

        <textarea
          id="typingInput"
          placeholder="Start typing here..."
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        ></textarea>

        <div class="progress-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="live-stats">
          <div class="stat-box">
            <span>WPM</span>
            <strong id="liveWpm">0</strong>
          </div>

          <div class="stat-box">
            <span>Accuracy</span>
            <strong id="liveAccuracy">100%</strong>
          </div>

          <div class="stat-box">
            <span>Time</span>
            <strong id="liveTime">0 sec</strong>
          </div>
        </div>

        <div class="button-row">
          <button id="startButton" class="primary-button">
            Start Lesson
          </button>

          <button id="resetButton" class="secondary-button">
            Reset
          </button>
        </div>

        <div class="lesson-result" id="lessonResult">
          <h3>Lesson Result</h3>

          <div class="result-grid">
            <div>
              <span>WPM</span>
              <strong id="resultWpm">0</strong>
            </div>

            <div>
              <span>Accuracy</span>
              <strong id="resultAccuracy">0%</strong>
            </div>

            <div>
              <span>Time</span>
              <strong id="resultTime">0 sec</strong>
            </div>
          </div>

          <p id="resultMessage"></p>
        </div>

      </section>

      <section class="completed-lessons-section">
        <div class="section-heading">
          <h2>Completed Lessons</h2>
          <button id="clearResultsButton" class="clear-button">
            Clear All Results
          </button>
        </div>

        <div id="completedLessons">
          <p class="empty-message">No lessons completed yet.</p>
        </div>
      </section>

    </main>

    <footer>
      Typing Practice App
    </footer>

  </div>

  <script src="lessons/lesson1.js"></script>
  <script src="app.js"></script>

</body>
</html>
