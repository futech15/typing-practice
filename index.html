<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Practice</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dff6ff, #e8ddff);
        display: flex;

    .container {
        width: 100%;
        max-width: 850px;

        border-radius: 24px;
        padding: 35px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        text-align: center;
    }

    h1 {
        margin-top: 0;
        color: #36454F;
    }

    .subtitle {

    .corrected {

    .typing-box:focus {

        background: #36454F;
        color: white;

</style>
</head>

<body>

<div class="container">

    <h1>Typing Practice</h1>
    <div class="subtitle">Lesson 1 — Home Row</div>

    <div id="lessonText" class="lesson-text"></div>

    <input
        type="text"
        id="typingBox"
        class="typing-box"
        placeholder="Start typing here..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
    >

    <div class="stats">
        <div class="stat">WPM: <strong id="wpm">0</strong></div>
        <div class="stat">Accuracy: <strong id="accuracy">100%</strong></div>
        <div class="stat">Time: <strong id="time">0</strong>s</div>
    </div>

    <button onclick="restartLesson()">Restart Lesson</button>

    <div id="result" class="result"></div>

    <div class="instructions">
        Type the letters exactly as shown. Corrected mistakes appear yellow.
    </div>

</div>

<script>
const lesson = "asdf jkl; asdf jkl;";

const lessonText = document.getElementById("lessonText");
const typingBox = document.getElementById("typingBox");
const wpmDisplay = document.getElementById("wpm");
const accuracyDisplay = document.getElementById("accuracy");
const timeDisplay = document.getElementById("time");
const resultDisplay = document.getElementById("result");

let startTime = null;
let timerInterval = null;
let finished = false;
let mistakePositions = new Set();

function renderText() {
    const typed = typingBox.value;

    lessonText.innerHTML = "";

    for (let i = 0; i < lesson.length; i++) {
        const span = document.createElement("span");
        span.className = "letter";
        span.textContent = lesson[i];

        if (i < typed.length) {
            if (typed[i] === lesson[i]) {
                if (mistakePositions.has(i)) {
                    span.classList.add("corrected");
                } else {
                    span.classList.add("correct");
                }
            } else {
                span.classList.add("wrong");
            }
        }

        if (i === typed.length && !finished) {
            span.classList.add("current");
        }

        lessonText.appendChild(span);
    }
}

function startTimer() {
    if (!startTime) {
        startTime = Date.now();

        timerInterval = setInterval(() => {
            const seconds = Math.floor((Date.now() - startTime) / 1000);
            timeDisplay.textContent = seconds;
            updateStats();
        }, 1000);
    }
}

function updateStats() {
    if (!startTime) return;

    const elapsedMinutes = (Date.now() - startTime) / 60000;
    const typedCharacters = typingBox.value.length;

    const wpm = elapsedMinutes > 0
        ? Math.round((typedCharacters / 5) / elapsedMinutes)
        : 0;

    let correct = 0;

    for (let i = 0; i < typingBox.value.length; i++) {
        if (typingBox.value[i] === lesson[i]) {
            correct++;
        }
    }

    const accuracy = typedCharacters > 0
        ? Math.round((correct / typedCharacters) * 100)
        : 100;

    wpmDisplay.textContent = wpm;
    accuracyDisplay.textContent = accuracy + "%";
}

typingBox.addEventListener("input", () => {
    if (finished) return;

    startTimer();

    const typed = typingBox.value;

    // Record positions where the student made a mistake.
    for (let i = 0; i < typed.length; i++) {
        if (typed[i] !== lesson[i]) {
            mistakePositions.add(i);
        }
    }

    renderText();
    updateStats();

    if (typed === lesson) {
        finishLesson();
    }
});

function finishLesson() {
    finished = true;
    clearInterval(timerInterval);

    const seconds = Math.max(1, Math.floor((Date.now() - startTime) / 1000));
    const words = lesson.trim().split(/\s+/).length;
    const wpm = Math.round((words / seconds) * 60);

    resultDisplay.textContent =
        "Lesson Complete! " + wpm + " WPM — Great job!";
}

function restartLesson() {
    clearInterval(timerInterval);

    startTime = null;
    timerInterval = null;
    finished = false;
    mistakePositions = new Set();

    typingBox.value = "";
    wpmDisplay.textContent = "0";
    accuracyDisplay.textContent = "100%";
    timeDisplay.textContent = "0";
    resultDisplay.textContent = "";

    renderText();
    typingBox.focus();
}

renderText();
</script>

</body>
</html>
